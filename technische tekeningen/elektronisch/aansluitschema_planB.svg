<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="1100" height="880" fill="#ffffff"/>
  <style>
    .box{fill:#f4f6fa;stroke:#1f2d3d;stroke-width:1.6}
    .w{stroke:#1f2d3d;stroke-width:1.4;fill:none}
    .pin{fill:#1f2d3d}
    .net{fill:#0b5cad;font-weight:bold}
    .pwr{fill:#b3261e;font-weight:bold}
    .t{font-size:14px;font-weight:bold;fill:#1f2d3d}
    .s{font-size:10.5px;fill:#4a5563}
    .warn{font-size:11px;fill:#b3261e}
  </style>

  <text x="20" y="24" font-size="17" font-weight="bold" fill="#1f2d3d">Linefollower plan B - aansluitschema</text>
  <text x="20" y="42" class="s">Arduino Nano (ATmega328P) - QTR-8A - DRV8833 - 2x N20 6 V - HC-06 - 2S 18650 - DSN-MINI-360. Gelijke netnamen zijn met elkaar verbonden. Alle GND gemeenschappelijk.</text>

  <!-- ===================== BATTERIJ + SCHAKELAAR ===================== -->
  <rect class="box" x="30" y="70" width="150" height="70" rx="4"/>
  <text class="t" x="40" y="90">BT1 2S 18650</text>
  <text class="s" x="40" y="106">2x DMEGC INR18650-25P</text>
  <text class="s" x="40" y="120">in serie: 6,0 - 8,4 V</text>
  <text class="s" x="40" y="134">(geen BMS)</text>
  <line class="w" x1="180" y1="85" x2="215" y2="85"/><text class="pwr" x="184" y="80">+</text>
  <line class="w" x1="180" y1="125" x2="215" y2="125"/><text class="s" x="184" y="138">-</text>
  <text class="net" x="220" y="129">GND</text>
  <!-- schakelaar -->
  <circle cx="218" cy="85" r="3" class="pin"/>
  <line class="w" x1="218" y1="85" x2="250" y2="72"/>
  <circle cx="254" cy="85" r="3" class="pin"/>
  <text class="s" x="205" y="64">SW1 hoofdschakelaar</text>
  <line class="w" x1="254" y1="85" x2="290" y2="85"/>
  <text class="pwr" x="294" y="89">VBAT</text>

  <!-- ===================== DSN-MINI-360 ===================== -->
  <rect class="box" x="30" y="170" width="150" height="80" rx="4"/>
  <text class="t" x="40" y="190">U3 DSN-MINI-360</text>
    <line class="w" x1="180" y1="200" x2="215" y2="200"/><text class="s" x="146" y="204">IN+</text><text class="pwr" x="219" y="204">VBAT</text>
  <line class="w" x1="180" y1="215" x2="215" y2="215"/><text class="s" x="146" y="219">IN-</text><text class="net" x="219" y="219">GND</text>
  <line class="w" x1="180" y1="230" x2="215" y2="230"/><text class="s" x="140" y="234">OUT+</text><text class="pwr" x="219" y="234">VMOT (6,0 V)</text>
  <line class="w" x1="180" y1="245" x2="215" y2="245"/><text class="s" x="140" y="249">OUT-</text><text class="net" x="219" y="249">GND</text>

  <!-- ===================== DRV8833 ===================== -->
  <g transform="translate(0,100)">
  <rect class="box" x="230" y="290" width="130" height="250" rx="4"/>
  <text class="t" x="240" y="310">U2 DRV8833</text>
  <text class="s" x="240" y="324">dual H-brug module</text>
  <!-- linkerpinnen -->
  <line class="w" x1="230" y1="350" x2="195" y2="350"/><text class="s" x="236" y="354">VM</text><text class="pwr" x="150" y="354">VMOT</text>
  <line class="w" x1="230" y1="375" x2="195" y2="375"/><text class="s" x="236" y="379">GND</text><text class="net" x="160" y="379">GND</text>
  <line class="w" x1="230" y1="420" x2="150" y2="420"/><text class="s" x="236" y="424">OUT1</text>
  <line class="w" x1="230" y1="445" x2="150" y2="445"/><text class="s" x="236" y="449">OUT2</text>
  <line class="w" x1="230" y1="485" x2="150" y2="485"/><text class="s" x="236" y="489">OUT3</text>
  <line class="w" x1="230" y1="510" x2="150" y2="510"/><text class="s" x="236" y="514">OUT4</text>
  <!-- motoren -->
  <line class="w" x1="150" y1="420" x2="150" y2="445"/>
  <circle cx="118" cy="432" r="20" fill="#fff" stroke="#1f2d3d" stroke-width="1.6"/><text x="110" y="437" font-weight="bold">M1</text>
  <line class="w" x1="138" y1="432" x2="150" y2="432"/>
  <line class="w" x1="150" y1="485" x2="150" y2="510"/>
  <circle cx="118" cy="497" r="20" fill="#fff" stroke="#1f2d3d" stroke-width="1.6"/><text x="110" y="502" font-weight="bold">M2</text>
  <line class="w" x1="138" y1="497" x2="150" y2="497"/>
  <text class="s" x="20" y="400">N20 6 V 1000 rpm</text>
  <text class="s" x="20" y="537">kanaal A = OUT1/OUT2</text>
  <text class="s" x="20" y="551">kanaal B = OUT3/OUT4</text>
  <!-- ingangen rechts: rechtstreeks naar Nano -->
  <text class="s" x="320" y="384">IN4</text>
  <text class="s" x="320" y="414">IN3</text>
  <text class="s" x="320" y="444">IN2</text>
  <text class="s" x="320" y="474">IN1</text>
  <line class="w" x1="360" y1="380" x2="395" y2="380"/><text class="net" x="399" y="384">IN4</text>
  <line class="w" x1="360" y1="410" x2="395" y2="410"/><text class="net" x="399" y="414">IN3</text>
  <line class="w" x1="360" y1="440" x2="395" y2="440"/><text class="net" x="399" y="444">IN2</text>
  <line class="w" x1="360" y1="470" x2="395" y2="470"/><text class="net" x="399" y="474">IN1</text>

  </g>
  <line class="w" x1="470" y1="230" x2="440" y2="230"/><text class="net" x="410" y="234">IN4</text>
  <line class="w" x1="470" y1="260" x2="440" y2="260"/><text class="net" x="410" y="264">IN3</text>
  <line class="w" x1="470" y1="290" x2="440" y2="290"/><text class="net" x="410" y="294">IN2</text>
  <line class="w" x1="470" y1="320" x2="440" y2="320"/><text class="net" x="410" y="324">IN1</text>
  <!-- ===================== ARDUINO NANO ===================== -->
  <rect class="box" x="470" y="110" width="160" height="400" rx="4"/>
  <text class="t" x="505" y="100">U1 Arduino Nano</text>
  <text class="s" x="498" y="525">ATmega328P 5 V 16 MHz (CH340)</text>
  <g class="s">
    <text x="476" y="144">VIN</text><text x="476" y="174">5V</text><text x="476" y="204">GND</text>
    <text x="476" y="234">D2</text><text x="476" y="264">D3 ~</text><text x="476" y="294">D5 ~</text><text x="476" y="324">D6 ~</text>
    <text x="476" y="354">D7</text><text x="476" y="384">D8</text><text x="476" y="414">D10</text><text x="476" y="444">D12</text><text x="476" y="474">D13</text>
    <text x="476" y="498">D0/D1: vrij (USB)</text>
  </g>
  <line class="w" x1="470" y1="140" x2="410" y2="140"/><text class="pwr" x="372" y="144">VBAT</text>
  <line class="w" x1="470" y1="170" x2="410" y2="170"/><text class="pwr" x="380" y="174">+5V</text>
  <line class="w" x1="470" y1="200" x2="410" y2="200"/><text class="net" x="378" y="204">GND</text>
  <line class="w" x1="470" y1="350" x2="440" y2="350"/>
  <line class="w" x1="470" y1="380" x2="440" y2="380"/>
  <g class="s"><text x="606" y="144">A0</text><text x="606" y="174">A1</text><text x="606" y="204">A2</text><text x="606" y="234">A3</text>
    <text x="606" y="264">A4</text><text x="606" y="294">A5</text><text x="606" y="324">A6</text><text x="606" y="354">A7</text></g>
  <text class="s" x="560" y="300">~ = PWM</text>

  <!-- D7 / D8 / D10 / D12 / D13 netlabels -->
  <text class="net" x="392" y="354">BT_TX</text>
  <text class="net" x="392" y="384">D8_TX</text>
  <text class="net" x="650" y="572">D8_TX</text>

  <!-- ===================== QTR-8A ===================== -->
  <rect class="box" x="840" y="110" width="170" height="330" rx="4"/>
  <text class="t" x="852" y="100">U4 Pololu QTR-8A</text>
  <g class="s"><text x="846" y="144">OUT1</text><text x="846" y="174">OUT2</text><text x="846" y="204">OUT3</text><text x="846" y="234">OUT4</text>
    <text x="846" y="264">OUT5</text><text x="846" y="294">OUT6</text><text x="846" y="324">OUT7</text><text x="846" y="354">OUT8</text>
    <text x="846" y="384">VCC</text><text x="846" y="408">GND</text><text x="846" y="432">LEDON</text></g>
  <text class="s" x="910" y="390">3.3V BYPASS: open</text>
  <text class="s" x="910" y="404">(werking op 5 V)</text>
  <g class="w">
    <line x1="630" y1="140" x2="840" y2="140"/><line x1="630" y1="170" x2="840" y2="170"/>
    <line x1="630" y1="200" x2="840" y2="200"/><line x1="630" y1="230" x2="840" y2="230"/>
    <line x1="630" y1="260" x2="840" y2="260"/><line x1="630" y1="290" x2="840" y2="290"/>
    <line x1="630" y1="320" x2="840" y2="320"/><line x1="630" y1="350" x2="840" y2="350"/>
  </g>
  <line class="w" x1="840" y1="380" x2="800" y2="380"/><text class="pwr" x="770" y="384">+5V</text>
  <line class="w" x1="840" y1="404" x2="800" y2="404"/><text class="net" x="768" y="408">GND</text>
  <line class="w" x1="840" y1="428" x2="800" y2="428"/><text class="net" x="755" y="432">D13</text>

  <!-- ===================== HC-06 + spanningsdeler ===================== -->
  <rect class="box" x="840" y="480" width="170" height="130" rx="4"/>
  <text class="t" x="852" y="500">U5 HC-06</text>
  <text class="s" x="852" y="514">Bluetooth SPP, 9600 baud</text>
  <g class="s"><text x="846" y="534">VCC</text><text x="846" y="558">GND</text><text x="846" y="582">TXD</text><text x="846" y="606">RXD</text></g>
  <line class="w" x1="840" y1="530" x2="800" y2="530"/><text class="pwr" x="770" y="534">+5V</text>
  <line class="w" x1="840" y1="554" x2="800" y2="554"/><text class="net" x="768" y="558">GND</text>
  <line class="w" x1="840" y1="578" x2="800" y2="578"/><text class="net" x="738" y="582">BT_TX</text><text class="s" x="700" y="594">(= D7)</text>
  <!-- deler: D8 - R1 1k - knooppunt - R2 2k - GND -->
  <line class="w" x1="690" y1="578" x2="690" y2="640"/>
  <rect x="700" y="633" width="40" height="14" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"/>
  <text class="s" x="700" y="628">R1 1k</text>
  <line class="w" x1="690" y1="640" x2="700" y2="640"/>
  <line class="w" x1="740" y1="640" x2="820" y2="640"/>
  <polyline class="w" points="820,640 820,602 840,602"/>
  <circle cx="780" cy="640" r="3" class="pin"/>
  <line class="w" x1="780" y1="640" x2="780" y2="660"/>
  <rect x="773" y="660" width="14" height="36" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"/>
  <text class="s" x="792" y="682">R2 2k</text>
  <line class="w" x1="780" y1="696" x2="780" y2="708"/>
  <line class="w" x1="770" y1="708" x2="790" y2="708"/><line class="w" x1="774" y1="712" x2="786" y2="712"/><line class="w" x1="778" y1="716" x2="782" y2="716"/>
  <text class="s" x="702" y="664">5 V -&gt; 3,3 V</text>

  <!-- ===================== DRUKKNOP ===================== -->
  <g transform="translate(0,40)">
  <text class="t" x="400" y="610">Start/stop (D10)</text>
  <text class="pwr" x="400" y="640">+5V</text>
  <line class="w" x1="430" y1="636" x2="450" y2="636"/>
  <circle cx="452" cy="636" r="3" class="pin"/><line class="w" x1="452" y1="636" x2="482" y2="624"/><circle cx="486" cy="636" r="3" class="pin"/>
  <line class="w" x1="458" y1="622" x2="478" y2="622"/>
  <text class="s" x="446" y="654">S2 drukknop</text>
  <line class="w" x1="486" y1="636" x2="540" y2="636"/>
  <circle cx="520" cy="636" r="3" class="pin"/>
  <text class="net" x="544" y="640">D10</text>
  <line class="w" x1="520" y1="636" x2="520" y2="664"/>
  <rect x="513" y="664" width="14" height="36" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"/>
  <text class="s" x="532" y="686">R3 1k pull-down</text>
  <line class="w" x1="520" y1="700" x2="520" y2="712"/>
  <line class="w" x1="510" y1="712" x2="530" y2="712"/><line class="w" x1="514" y1="716" x2="526" y2="716"/><line class="w" x1="518" y1="720" x2="522" y2="720"/>

  <!-- ===================== LED ===================== -->
  <text class="t" x="400" y="760">Indicatie-LED (D12)</text>
  <text class="net" x="400" y="792">D12</text>
  <line class="w" x1="430" y1="788" x2="450" y2="788"/>
  <rect x="450" y="781" width="40" height="14" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"/>
  <text class="s" x="450" y="776">R4 220</text>
  <line class="w" x1="490" y1="788" x2="510" y2="788"/>
  <polygon points="510,778 510,798 528,788" fill="#fff" stroke="#1f2d3d" stroke-width="1.4"/>
  <line class="w" x1="528" y1="778" x2="528" y2="798"/>
  <line class="w" x1="528" y1="788" x2="550" y2="788"/>
  <text class="s" x="505" y="814">D1 wit</text>
  <text class="net" x="554" y="792">GND</text>

  </g>
  <!-- ===================== NETLABELS NANO (D10/D12/D13) ===================== -->
  <line class="w" x1="470" y1="410" x2="440" y2="410"/><text class="net" x="408" y="414">D10</text>
  <line class="w" x1="470" y1="440" x2="440" y2="440"/><text class="net" x="408" y="444">D12</text>
  <line class="w" x1="470" y1="470" x2="440" y2="470"/><text class="net" x="408" y="474">D13</text>

  <!-- ===================== OPMERKINGEN ===================== -->
  <rect x="640" y="740" width="440" height="104" fill="#fff6f5" stroke="#b3261e" stroke-width="1"/>
  <text class="warn" x="650" y="758" font-weight="bold">Open punten (te controleren op de robot)</text>
  <text class="warn" x="650" y="776">1. Gemeten 3,5 V op IN en OUT van U3: fout v&#243;&#243;r de converter (zie handleiding).</text>
  <text class="warn" x="650" y="792">2. Welke motor (links/rechts) aan OUT1/OUT2 hangt: zie readme (tegenstrijdig).</text>
  <text class="warn" x="650" y="808">3. D2 kan geen PWM. Knop op D10 = geen externe interrupt naast SoftwareSerial.</text>
  <text class="warn" x="650" y="824">   Voorstel: knop naar D2, IN4 naar D10 (zie code/finaal/readme.md).</text>
  <text class="warn" x="650" y="840">4. Geen BMS / batterijspanningsmeting aanwezig.</text>
</svg>
